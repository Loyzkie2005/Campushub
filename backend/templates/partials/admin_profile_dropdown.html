{% load static %}
<div class="dropdown header-profile-dropdown">
    <button class="header-profile border-0 bg-transparent p-0 shadow-none" type="button"
        data-bs-toggle="dropdown" aria-expanded="false"
        style="border: 0 !important; outline: 0 !important; box-shadow: none !important;">
        <img src="{% static 'assets/img/profile.jpg' %}?v=20260529" alt="{{ request.user.username }}"
            class="border-0 shadow-none" width="34" height="34"
            style="border: 0 !important; box-shadow: none !important; border-radius: 50%;" />
    </button>
    <div class="dropdown-menu dropdown-menu-end admin-profile-menu">
        <a class="dropdown-item admin-profile-item" href="#">
            <span>Settings</span>
        </a>
        <div class="dropdown-divider"></div>
        <a class="dropdown-item admin-profile-item is-danger" href="{% url 'admin_logout_page' %}">
            <span>Logout</span>
        </a>
    </div>
</div>
