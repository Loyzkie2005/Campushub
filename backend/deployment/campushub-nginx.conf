# Installed as /etc/nginx/sites-available/campushub after certificate issuance.
# Keep credentials/query tokens out of access logs and overwrite proxy headers.
log_format campushub_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                         '$status $body_bytes_sent $request_time';

map $http_upgrade $campushub_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name campushub-ch.duckdns.org;
    server_tokens off;
    access_log /var/log/nginx/campushub-access.log campushub_safe;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/campushub-acme;
        try_files $uri =404;
    }

    location / {
        return 301 https://campushub-ch.duckdns.org$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name campushub-ch.duckdns.org;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/campushub-ch.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/campushub-ch.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CampusHubSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 50m;
    access_log /var/log/nginx/campushub-access.log campushub_safe;

    location /static/ {
        alias /srv/campushub/shared/static/;
        expires 1h;
        add_header X-Content-Type-Options nosniff always;
    }

    # Raw media is deliberately not an unauthenticated filesystem alias.
    # Existing Django/API permissions still decide what can be requested.
    location ~ (^|/)\. {
        return 404;
    }

    location = /chat {
        return 308 /chat/;
    }

    location /chat/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host campushub-ch.duckdns.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $campushub_connection_upgrade;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host campushub-ch.duckdns.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 100s;
    }
}
