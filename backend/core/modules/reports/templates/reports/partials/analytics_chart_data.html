<details class="analytics-chart-data"><summary>View chart data</summary><div class="table-responsive"><table class="analytics-table"><caption>{{ caption }}</caption><thead><tr>{% for heading in chart_table.headers %}<th scope="col">{{ heading }}</th>{% endfor %}</tr></thead><tbody>{% for row in chart_table.rows %}<tr>{% for value in row %}{% if forloop.first %}<th scope="row">{{ value }}</th>{% else %}<td>{{ value }}</td>{% endif %}{% endfor %}</tr>{% empty %}<tr><td>No recorded values.</td></tr>{% endfor %}</tbody></table></div></details>
