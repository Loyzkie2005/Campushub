<section class="bk-kpi-grid" id="bkBookingKpis" data-filter="{{ booking_kpi_filter }}" aria-label="Facility booking summary">
  <button type="button" class="bk-kpi-card" data-booking-kpi="" aria-pressed="{% if not booking_kpi_filter %}true{% else %}false{% endif %}" aria-controls="bkAllBookingsBody">
    <span class="bk-kpi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25m10.5-2.25v2.25M3.75 9h16.5m-15 12h13.5A1.5 1.5 0 0 0 20.25 19.5V6.75a1.5 1.5 0 0 0-1.5-1.5H5.25a1.5 1.5 0 0 0-1.5 1.5V19.5a1.5 1.5 0 0 0 1.5 1.5Z"/></svg></span>
    <span class="bk-kpi-content"><span class="bk-kpi-label">Total Bookings</span><strong data-booking-count="total">{{ booking_kpis.total }}</strong><span class="bk-kpi-caption">All facility reservations</span></span>
  </button>
  <button type="button" class="bk-kpi-card" data-booking-kpi="pending" aria-pressed="{% if booking_kpi_filter == 'pending' %}true{% else %}false{% endif %}" aria-controls="bkAllBookingsBody">
    <span class="bk-kpi-icon bk-kpi-icon-gold"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8.25"/><path stroke-linecap="round" stroke-linejoin="round" d="M12 7.5V12l3 1.5"/></svg></span>
    <span class="bk-kpi-content"><span class="bk-kpi-label">Pending Approval</span><strong data-booking-count="pending">{{ booking_kpis.pending }}</strong><span class="bk-kpi-caption">Requires admin review</span></span>
  </button>
  <button type="button" class="bk-kpi-card" data-booking-kpi="upcoming" aria-pressed="{% if booking_kpi_filter == 'upcoming' %}true{% else %}false{% endif %}" aria-controls="bkAllBookingsBody">
    <span class="bk-kpi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25m10.5-2.25v2.25M3.75 9h16.5m-15 12h13.5A1.5 1.5 0 0 0 20.25 19.5V6.75a1.5 1.5 0 0 0-1.5-1.5H5.25a1.5 1.5 0 0 0-1.5 1.5V19.5a1.5 1.5 0 0 0 1.5 1.5Zm4.5 5.25 2.25 2.25 4.5-4.5"/></svg></span>
    <span class="bk-kpi-content"><span class="bk-kpi-label">Upcoming / Reserved</span><strong data-booking-count="upcoming">{{ booking_kpis.upcoming }}</strong><span class="bk-kpi-caption">Confirmed future bookings</span></span>
  </button>
  <button type="button" class="bk-kpi-card" data-booking-kpi="unpaid" aria-pressed="{% if booking_kpi_filter == 'unpaid' %}true{% else %}false{% endif %}" aria-controls="bkAllBookingsBody">
    <span class="bk-kpi-icon bk-kpi-icon-gold"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3.75h10.5v16.5l-2.625-1.5L12 20.25l-2.625-1.5-2.625 1.5V3.75Zm3 4.5h4.5m-4.5 3.75h4.5m-4.5 3.75h2.25"/></svg></span>
    <span class="bk-kpi-content"><span class="bk-kpi-label">Unpaid</span><strong data-booking-count="unpaid">{{ booking_kpis.unpaid }}</strong><span class="bk-kpi-caption">Awaiting payment / OR</span></span>
  </button>
</section>
