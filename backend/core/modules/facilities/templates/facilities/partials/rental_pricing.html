<div class="facility-form-field" data-rental-field="base_duration" hidden>
    <label for="facilityBaseDuration" class="form-label">Base Duration (hours) *</label>
    <input type="number" class="form-control" id="facilityBaseDuration" min="0.01" max="24" step="0.01" placeholder="e.g. 4">
</div>
<div class="facility-form-field" data-rental-field="additional_hour_rate" hidden>
    <label for="facilityAdditionalHourRate" class="form-label">Additional Hour Rate (₱) *</label>
    <input type="number" class="form-control" id="facilityAdditionalHourRate" min="0" step="0.01" placeholder="Enter additional hour rate">
</div>
<div class="facility-form-field facility-form-field-wide" data-rental-field="pricing_notes" hidden>
    <label for="facilityPricingNotes" class="form-label">Custom Pricing Description *</label>
    <textarea class="form-control" id="facilityPricingNotes" maxlength="2000" rows="3" placeholder="Explain the charging basis and quote requirements"></textarea>
</div>
<div class="facility-form-field" data-rental-field="partner_rate" hidden>
    <label for="facilityPartnerRate" class="form-label">Partner / Shared Room Rate (₱)</label>
    <input type="number" class="form-control" id="facilityPartnerRate" min="0" max="99999999.99" step="0.01" placeholder="Enter shared rate per person per night">
    <span class="facility-form-help">Applies only to the configured guest occupancy sharing the same room.</span>
</div>
<div class="facility-form-field" data-rental-field="partner_occupancy" hidden>
    <label for="facilityPartnerOccupancy" class="form-label">Partner Occupancy Required *</label>
    <input type="number" class="form-control" id="facilityPartnerOccupancy" min="2" max="2147483647" step="1" placeholder="Enter guests sharing the same room">
</div>
<div class="facility-form-field" data-rental-field="deposit_type" hidden>
    <label for="facilityDepositType" class="form-label">Deposit Type *</label>
    <select class="form-select" id="facilityDepositType"><option value="">Select type</option><option value="fixed">Fixed Amount</option><option value="percentage">Percentage</option></select>
</div>
<div class="facility-form-field" data-rental-field="deposit_value" hidden>
    <label for="facilityDepositValue" class="form-label">Deposit Value *</label>
    <input type="number" class="form-control" id="facilityDepositValue" min="0" step="0.01" placeholder="Enter deposit value">
    <span id="facilityDepositHelp" class="facility-form-help">Enter an amount or a percentage.</span>
</div>
<div class="facility-form-field facility-form-field-wide" data-rental-field="fees">
    <h3 class="facility-config-heading">Optional Additional Fees</h3>
    <p class="facility-form-help">Add charges for features, provided items or facility use that cost extra. No example fees are saved automatically.</p>
    <div id="facilityAdditionalFees" class="facility-fees-list"></div>
    <button type="button" id="facilityAddFee" class="facility-fee-action">+ Add Fee</button>
</div>
