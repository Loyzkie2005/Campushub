{% load static %}
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CampusHub | Job Order Request</title>
<link rel="stylesheet" href="{% static 'components/css/job_order.css' %}?v=20261027-sign-action-only">
{% include 'partials/web_typography.html' %}
</head><body class="beu-job-print-page">
<main data-job-order-standalone>
    <header class="beu-job-panel-heading"><h1>Job Order</h1><nav class="beu-job-panel-actions" aria-label="Job Order actions">
        <button type="button" class="beu-job-print" data-job-print disabled>Print</button>
        <div data-job-export data-pdf-url="{{ pdf_url }}" data-docx-url="{{ docx_url }}"></div>
    </nav></header>
    <div class="beu-job-preview" data-job-preview data-pdf-url="{{ preview_url }}"></div>
    {% if job_order_signing %}<section class="beu-signatures" id="beuStandaloneSignatures"></section>
    {{ job_order_signing|json_script:'beuStandaloneSigningData' }}{% csrf_token %}{% endif %}
</main>
<script src="{% static 'components/js/admin_session.js' %}?v=20261030-session-recheck"></script>
<script src="{% static 'components/js/job_order_preview.js' %}?v=20261027-sign-action-only"></script>
{% if job_order_signing %}<script src="{% static 'vendor/signature_pad/5.1.4/signature_pad.umd.min.js' %}"></script>
<script src="{% static 'components/js/job_order_signatures.js' %}?v=20261027-sign-action-only"></script>{% endif %}
</body></html>
