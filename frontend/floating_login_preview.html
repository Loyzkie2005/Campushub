<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CampusHub | Floating Login Preview</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        :root {
            --campushub-navy: #1A1851;
            --campushub-navy-dark: #121038;
            --campushub-gold: #FCB316;
            --campushub-muted: #64748b;
            --campushub-border: #e2e8f0;
        }

        *, *::before, *::after { box-sizing: border-box; }

        html, body { height: 100%; margin: 0; padding: 0; }

        body {
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--campushub-navy);
            background: radial-gradient(circle at 10% 15%, rgba(252, 179, 22, 0.18) 0%, rgba(26, 24, 81, 0) 55%),
                        radial-gradient(circle at 90% 85%, rgba(42, 39, 112, 0.45) 0%, rgba(18, 16, 56, 0) 65%),
                        linear-gradient(135deg, #161445 0%, #1A1851 50%, #100e33 100%);
            background-color: var(--campushub-navy);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        .login-page-shell {
            display: flex;
            flex-direction: column;
            width: 100%;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }

        .login-page-shell::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
            background-size: 32px 32px;
            pointer-events: none;
            z-index: 0;
        }

        .login-page-row {
            position: relative;
            z-index: 1;
            display: flex !important;
            flex: 1 1 auto;
            width: 100%;
            min-height: 100vh;
            margin: 0 !important;
        }

        .login-page-left {
            position: relative;
            z-index: 2;
            padding: 3rem 4rem !important;
        }

        .login-brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            top: 40px;
            left: 50px;
            z-index: 5;
        }

        .brand-emblem {
            width: 44px;
            height: 44px;
            background: #1A1851;
            border: 2px solid var(--campushub-gold);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
        }

        .brand-emblem .emblem-ch {
            color: #ffffff;
            font-weight: 800;
            font-size: 14px;
            line-height: 1;
        }

        .brand-emblem .emblem-ustp {
            color: var(--campushub-gold);
            font-weight: 700;
            font-size: 7px;
            letter-spacing: 0.5px;
        }

        .brand-text {
            font-size: 1.65rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin: 0;
        }

        .hero-heading {
            font-size: 3.8rem;
            line-height: 1.18;
            letter-spacing: -0.02em;
            font-weight: 800;
        }

        .hero-badge-simplified {
            background-color: var(--campushub-gold);
            color: var(--campushub-navy);
            padding: 4px 22px;
            border-radius: 18px;
            display: inline-block;
            margin-top: 8px;
            font-weight: 800;
            box-shadow: 0 8px 24px rgba(252, 179, 22, 0.35);
        }

        .hero-subtitle {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.15rem;
            line-height: 1.5;
            max-width: 480px;
        }

        .hero-feature-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 2rem;
        }

        .hero-feature-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            backdrop-filter: blur(8px);
        }

        .hero-feature-tag svg { color: var(--campushub-gold); }

        .login-page-right {
            position: relative;
            z-index: 2;
            padding: 2.5rem !important;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-floating-card {
            width: 100%;
            max-width: 460px;
            min-height: 560px;
            background: #ffffff;
            border-radius: 28px;
            padding: 3.75rem 2.65rem;
            border: 1px solid rgba(255, 255, 255, 0.95);
            box-shadow: 0 30px 75px -15px rgba(5, 4, 30, 0.52),
                        0 0 0 1px rgba(255, 255, 255, 0.18);
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .login-floating-card:hover {
            box-shadow: 0 35px 85px -12px rgba(5, 4, 30, 0.62),
                        0 0 0 1px rgba(252, 179, 22, 0.25);
        }

        .login-title {
            color: var(--campushub-navy);
            font-size: 2.1rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 6px;
        }

        .login-subtitle {
            color: var(--campushub-muted);
            font-size: 0.92rem;
            margin-bottom: 2rem;
        }

        #adminLoginForm .form-label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--campushub-navy);
            margin-bottom: 6px;
        }

        #adminLoginForm .mb-3 { margin-bottom: 1.35rem !important; }
        #adminLoginForm .mb-2 { margin-bottom: 1rem !important; }

        #adminLoginForm .input-group {
            border-radius: 14px;
            overflow: hidden;
            background: #f8fafc;
            border: 1.5px solid var(--campushub-border);
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        #adminLoginForm .input-group:focus-within {
            border-color: var(--campushub-gold) !important;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(252, 179, 22, 0.18);
        }

        #adminLoginForm .input-group-text {
            background: transparent !important;
            border: none !important;
            width: 48px;
            padding: 0 0 0 16px;
            color: #64748b;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #adminLoginForm .form-control {
            background: transparent !important;
            border: none !important;
            min-height: 52px;
            font-size: 0.98rem;
            font-weight: 500;
            color: #1e293b;
            padding-left: 12px;
        }

        #adminLoginForm .form-control:focus { box-shadow: none; }

        .password-input-group { position: relative; }

        .password-toggle-btn {
            position: absolute;
            top: 50%;
            right: 8px;
            z-index: 6;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: transparent;
            color: #94a3b8;
            cursor: pointer;
            transform: translateY(-50%);
        }

        .login-options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 1rem 0 1.4rem 0;
        }

        .form-check-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--campushub-navy);
            cursor: pointer;
        }

        .form-check-input {
            width: 1.1rem;
            height: 1.1rem;
            margin-top: 0.15rem;
            border: 1.5px solid #cbd5e1;
            cursor: pointer;
        }

        .form-check-input:checked {
            background-color: var(--campushub-navy) !important;
            border-color: var(--campushub-navy) !important;
        }

        .forgot-password-link {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--campushub-navy);
            text-decoration: none;
            transition: color 0.15s ease;
        }

        .forgot-password-link:hover {
            color: #c98b04;
            text-decoration: underline;
        }

        .btn-login {
            position: relative;
            min-height: 52px;
            background: linear-gradient(135deg, #1A1851 0%, #282470 100%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.3px;
            box-shadow: 0 10px 25px -5px rgba(26, 24, 81, 0.4);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-login:hover {
            background: linear-gradient(135deg, #FCB316 0%, #f0a300 100%);
            color: #1A1851;
            border-color: var(--campushub-gold);
            transform: translateY(-2px);
            box-shadow: 0 12px 28px -5px rgba(252, 179, 22, 0.45);
        }

        .login-security-badge {
            margin-top: 1.4rem;
            padding-top: 1.1rem;
            border-top: 1px solid #f1f5f9;
            text-align: center;
            font-size: 0.75rem;
            color: var(--campushub-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        @media (min-width: 1200px) {
            .login-page-right {
                padding-right: 6vw !important;
                justify-content: flex-end;
            }
        }
    </style>
</head>
<body>
    <main class="container-fluid p-0 login-page-shell">
        <div class="row g-0 login-page-row">

            <!-- Left Hero Section -->
            <div class="col-lg-7 col-xl-7 d-flex flex-column justify-content-center position-relative login-page-left">

                <!-- Header Logo -->
                <div class="position-absolute login-brand-logo">
                    <div class="brand-emblem">
                        <span class="emblem-ch">CH</span>
                        <span class="emblem-ustp">USTP</span>
                    </div>
                    <h4 class="brand-text">
                        <span style="color: #FCB316;">Campus</span><span style="color: #ffffff;">Hub</span>
                    </h4>
                </div>

                <div style="max-width: 620px; margin-left: 5%;" class="mt-5 pt-4 pt-lg-0">
                    <h1 class="text-white hero-heading">
                        Your <span style="color: #FCB316;">Campus</span><br>
                        Essentials,<br>
                        <span class="hero-badge-simplified">Simplified.</span>
                    </h1>
                    <p class="mt-4 hero-subtitle">
                        Access everything you need for campus life in one unified platform.
                    </p>
                </div>
            </div>

            <!-- Right Section: Floating Login Card -->
            <div class="col-lg-5 col-xl-5 login-page-right">
                
                <div class="login-floating-card">
                    <div class="text-center mb-4 mt-2">
                        <h2 class="login-title">Welcome Back</h2>
                        <p class="login-subtitle">Sign in to your account</p>
                    </div>

                    <form id="adminLoginForm">
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></svg>
                                </span>
                                <input id="username" name="username" type="text" class="form-control" value="2023304615" placeholder="Enter your username" />
                            </div>
                        </div>

                        <div class="mb-2">
                            <label for="password" class="form-label">Password</label>
                            <div class="input-group password-input-group">
                                <span class="input-group-text">
                                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></svg>
                                </span>
                                <input id="password" name="password" type="password" class="form-control password-input" value="CampusHub2026" placeholder="Enter your password" />
                            </div>
                        </div>

                        <div class="login-options-row">
                            <div class="form-check m-0">
                                <input type="checkbox" class="form-check-input" id="rememberMe" checked />
                                <label class="form-check-label" for="rememberMe">Remember Me</label>
                            </div>
                            <a href="#" class="forgot-password-link">Forgot password?</a>
                        </div>

                        <button type="button" class="btn btn-login w-100 d-flex align-items-center justify-content-center gap-2">
                            <span>Login</span>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14" /><path d="m12 5 7 7-7 7" /></svg>
                        </button>
                    </form>
                </div>

            </div>
        </div>
    </main>
</body>
</html>
