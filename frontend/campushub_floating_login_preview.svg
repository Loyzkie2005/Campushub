<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap');
      * { font-family: 'Montserrat', Arial, sans-serif; }
      
      .glow-gold { filter: blur(80px); opacity: 0.22; }
      .glow-blue { filter: blur(90px); opacity: 0.35; }
      .card-shadow { filter: drop-shadow(0px 30px 65px rgba(5, 4, 25, 0.5)); }
      .btn-shadow { filter: drop-shadow(0px 8px 18px rgba(26, 24, 81, 0.35)); }
    </style>

    <linearGradient id="bg-canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14123E"/>
      <stop offset="50%" stop-color="#1A1851"/>
      <stop offset="100%" stop-color="#0E0C30"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fcfdff"/>
    </linearGradient>

    <linearGradient id="btn-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1A1851"/>
      <stop offset="100%" stop-color="#282470"/>
    </linearGradient>

    <pattern id="dot-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(255,255,255,0.06)"/>
    </pattern>
  </defs>

  <!-- FULL VIEWPORT BACKGROUND -->
  <rect width="1440" height="900" fill="url(#bg-canvas)"/>
  <rect width="1440" height="900" fill="url(#dot-grid)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="100" cy="100" r="280" fill="#FCB316" class="glow-gold"/>
  <circle cx="1300" cy="800" r="320" fill="#3b3799" class="glow-blue"/>

  <!-- LEFT HERO SECTION -->
  <g transform="translate(80, 60)">
    <rect x="0" y="0" width="46" height="46" rx="10" fill="#1A1851" stroke="#FCB316" stroke-width="2"/>
    <text x="23" y="27" fill="#ffffff" font-size="16" font-weight="800" text-anchor="middle">CH</text>
    <text x="23" y="38" fill="#FCB316" font-size="7" font-weight="700" text-anchor="middle" letter-spacing="1">USTP</text>

    <text x="58" y="29" fill="#FCB316" font-size="22" font-weight="800" letter-spacing="0.5">Campus<tspan fill="#ffffff">Hub</tspan></text>
  </g>

  <g transform="translate(80, 270)">
    <text x="0" y="0" fill="#ffffff" font-size="56" font-weight="800" line-height="1.15">
      Your <tspan fill="#FCB316">Campus</tspan>
    </text>
    <text x="0" y="70" fill="#ffffff" font-size="56" font-weight="800">
      Essentials,
    </text>
    
    <g transform="translate(0, 105)">
      <rect x="0" y="0" width="310" height="64" rx="20" fill="#FCB316"/>
      <text x="24" y="46" fill="#1A1851" font-size="44" font-weight="800" letter-spacing="-0.5">Simplified.</text>
    </g>

    <text x="0" y="220" fill="rgba(255,255,255,0.75)" font-size="18" font-weight="500">
      Access everything you need for campus life in one unified platform.
    </text>
  </g>

  <!-- RIGHT SIDE: TALLER FLOATING LOGIN CARD WITH WELCOME BACK -->
  <g class="card-shadow" transform="translate(890, 120)">
    <rect x="0" y="0" width="470" height="660" rx="30" fill="url(#card-grad)"/>
    <rect x="1" y="1" width="468" height="658" rx="29" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="1.5"/>

    <g transform="translate(50, 48)">
      
      <!-- Welcome Back Header & Subtitle -->
      <text x="185" y="38" fill="#1A1851" font-size="32" font-weight="800" letter-spacing="-0.5" text-anchor="middle">Welcome Back</text>
      <text x="185" y="68" fill="#64748b" font-size="13" font-weight="500" text-anchor="middle">Sign in to your account</text>

      <!-- Username Input Field -->
      <g transform="translate(0, 118)">
        <text x="0" y="0" fill="#1A1851" font-size="12.5" font-weight="700">Username</text>
        <rect x="0" y="10" width="370" height="54" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
        <g transform="translate(16, 27)">
          <circle cx="8" cy="6" r="4" fill="none" stroke="#64748b" stroke-width="1.8"/>
          <path d="M1 18 C1 13, 15 13, 15 18" fill="none" stroke="#64748b" stroke-width="1.8"/>
        </g>
        <text x="50" y="44" fill="#1e293b" font-size="14.5" font-weight="600">2023304615</text>
      </g>

      <!-- Password Input Field -->
      <g transform="translate(0, 220)">
        <text x="0" y="0" fill="#1A1851" font-size="12.5" font-weight="700">Password</text>
        <rect x="0" y="10" width="370" height="54" rx="14" fill="#ffffff" stroke="#FCB316" stroke-width="2"/>
        <g transform="translate(16, 27)">
          <rect x="2" y="8" width="14" height="10" rx="2" fill="none" stroke="#1A1851" stroke-width="1.8"/>
          <path d="M5 8 V5 A4 4 0 0 1 13 5 V8" fill="none" stroke="#1A1851" stroke-width="1.8"/>
        </g>
        <text x="50" y="44" fill="#1e293b" font-size="14.5" font-weight="600">&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;</text>
        <g transform="translate(335, 28)" cursor="pointer">
          <path d="M1 9 C4 3, 14 3, 17 9 C14 15, 4 15, 1 9 Z" fill="none" stroke="#64748b" stroke-width="1.8"/>
          <circle cx="9" cy="9" r="3" fill="none" stroke="#64748b" stroke-width="1.8"/>
        </g>
      </g>

      <!-- Options Row -->
      <g transform="translate(0, 328)">
        <rect x="0" y="0" width="18" height="18" rx="5" fill="#1A1851"/>
        <path d="M4 9 L7.5 13 L14 5" fill="none" stroke="#FCB316" stroke-width="2" stroke-linecap="round"/>
        <text x="28" y="14" fill="#1A1851" font-size="12.5" font-weight="600">Remember Me</text>
        <text x="370" y="14" fill="#FCB316" font-size="12.5" font-weight="700" text-anchor="end">Forgot password?</text>
      </g>

      <!-- Submit Button -->
      <g class="btn-shadow" transform="translate(0, 390)">
        <rect x="0" y="0" width="370" height="56" rx="14" fill="url(#btn-grad)"/>
        <rect x="0" y="0" width="370" height="56" rx="14" fill="none" stroke="#FCB316" stroke-width="1" opacity="0.6"/>
        <text x="170" y="34" fill="#ffffff" font-size="15.5" font-weight="700" text-anchor="middle">Login</text>
        <path d="M220 28 L232 28 M227 23 L232 28 L227 33" stroke="#FCB316" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

    </g>
  </g>
</svg>
